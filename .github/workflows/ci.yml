name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Test
        run: go test ./...
      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Windows resources
        run: go run ./cmd/winres -version "${{ steps.ver.outputs.version }}" -o cmd/call-detect/rsrc_windows_amd64.syso
      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H windowsgui -s -w -X github.com/scallister/call-detect/internal/version.Version=${{ steps.ver.outputs.version }}" -o call-detect.exe ./cmd/call-detect
      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/scallister/call-detect/internal/version.Version=${{ steps.ver.outputs.version }}" -o call-detect-linux-amd64 ./cmd/call-detect
      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/scallister/call-detect/internal/version.Version=${{ steps.ver.outputs.version }}" -o call-detect-linux-arm64 ./cmd/call-detect
      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/scallister/call-detect/internal/version.Version=${{ steps.ver.outputs.version }}" -o call-detect-darwin-amd64 ./cmd/call-detect
      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/scallister/call-detect/internal/version.Version=${{ steps.ver.outputs.version }}" -o call-detect-darwin-arm64 ./cmd/call-detect
      - uses: actions/upload-artifact@v4
        with:
          name: call-detect
          path: |
            call-detect.exe
            call-detect-linux-amd64
            call-detect-linux-arm64
            call-detect-darwin-amd64
            call-detect-darwin-arm64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Build
        run: |
          ver="${GITHUB_REF_NAME}"
          go run ./cmd/winres -version "${ver}" -o cmd/call-detect/rsrc_windows_amd64.syso
          flags="-s -w -X github.com/scallister/call-detect/internal/version.Version=${ver}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H windowsgui ${flags}" -o call-detect.exe ./cmd/call-detect
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${flags}" -o call-detect-linux-amd64 ./cmd/call-detect
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${flags}" -o call-detect-linux-arm64 ./cmd/call-detect
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${flags}" -o call-detect-darwin-amd64 ./cmd/call-detect
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${flags}" -o call-detect-darwin-arm64 ./cmd/call-detect
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            call-detect.exe
            call-detect-linux-amd64
            call-detect-linux-arm64
            call-detect-darwin-amd64
            call-detect-darwin-arm64
